version: 2

# Policy: patch vulnerabilities fast, refresh everything else rarely.
#
# - Security fixes come from Dependabot security updates (a repo setting, not
#   this file). They open a PR as soon as an advisory affects us. The schedule
#   and cooldown below only govern version updates, so they never delay a
#   security fix.
# - Version updates: one combined PR per quarter for Gradle, Actions, the
#   llama.cpp submodule and fastlane, majors included (read their release
#   notes before merging).
# - A release must be 30 days old before a version update picks it up, so a
#   broken or hijacked release has usually been pulled by then.

multi-ecosystem-groups:
  quarterly-refresh:
    schedule:
      interval: quarterly

updates:
  # Gradle plugins and AndroidX/Kotlin libraries (gradle/libs.versions.toml).
  - package-ecosystem: gradle
    directory: /
    patterns: ['*']
    multi-ecosystem-group: quarterly-refresh
    cooldown:
      default-days: 30
    # If several advisories land at once, fix them in one PR.
    groups:
      gradle-security:
        applies-to: security-updates
        patterns: ['*']

  # Actions are pinned to commit SHAs; Dependabot keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: quarterly-refresh
    cooldown:
      default-days: 30

  # llama.cpp (app/src/main/cpp/llama.cpp). The submodule follows the
  # `branch` in .gitmodules, a fixed andriydruk/llama.cpp-android branch
  # per upstream build (android-bNNNNN), so this only proposes fixes pushed
  # to that branch. Moving to a newer llama.cpp build means pointing
  # .gitmodules at the next branch by hand (see MAINTAINING.md). Submodule
  # commits have no release dates, so there is no cooldown here.
  - package-ecosystem: gitsubmodule
    directory: /
    patterns: ['*']
    multi-ecosystem-group: quarterly-refresh

  # fastlane and its gems (Gemfile.lock), used to publish to Google Play.
  # The store listing check installs the bundle on the latest stable Ruby,
  # so a bump that does not work there fails on its pull request.
  - package-ecosystem: bundler
    directory: /
    patterns: ['*']
    multi-ecosystem-group: quarterly-refresh
    cooldown:
      default-days: 30
    # If several advisories land at once, fix them in one PR.
    groups:
      bundler-security:
        applies-to: security-updates
        patterns: ['*']
