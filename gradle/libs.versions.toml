[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
work = "2.12.0"
documentfile = "1.1.0"
coroutines = "1.11.0"
serialization = "1.11.0"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.76.0"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"

# Security floors for the build tools' own dependencies (AGP, its lint and
# signing tools), set as constraints in build.gradle.kts. These never ship in
# the app; they fix Dependabot alerts on the build classpath. Drop one once AGP
# itself requires at least that version.
guavaFloor = "33.7.2-jre"
bouncycastleFloor = "1.86"
jose4jFloor = "0.9.7"
jdom2Floor = "2.0.6.1"
commonsLang3Floor = "3.21.0"
httpclientFloor = "4.5.14"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
floor-guava = { module = "com.google.guava:guava", version.ref = "guavaFloor" }
floor-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastleFloor" }
floor-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastleFloor" }
floor-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastleFloor" }
floor-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "jose4jFloor" }
floor-jdom2 = { module = "org.jdom:jdom2", version.ref = "jdom2Floor" }
floor-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3Floor" }
floor-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclientFloor" }
